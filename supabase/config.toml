project_id = "gxawhrkctjhneasimoek"

# verify_jwt defaults to true, but it is pinned here so a future
# `--no-verify-jwt` deploy cannot quietly remove the gateway check.
#
# Note that gateway verification alone is not sufficient: the project anon key
# is itself a valid JWT. The check that actually separates a real user from
# someone replaying the public key is auth.uid() inside consume_ai_quota(),
# called by supabase/functions/_shared/auth.ts.

[functions.analyze-learning-material]
verify_jwt = true

[functions.generate-themed-deck]
verify_jwt = true

[functions.evaluate-translation]
verify_jwt = true

[functions.pronunciation-feedback]
verify_jwt = true

[functions.synthesize-speech]
verify_jwt = true

# Called only by the Database Webhook on profiles INSERT (configured in the
# dashboard); Supabase signs that call itself.
[functions.notify-signup]
verify_jwt = true

# Reached by a plain browser click on the link in the notification email, so
# there is no Authorization header to verify. This function authorizes
# itself with the service-role key instead — see its source for why.
[functions.approve-user]
verify_jwt = false

[auth]
# Real accounts now gate access, so the anonymous fallback used only to give
# each device a distinct auth.uid() for the quota is no longer needed.
enable_anonymous_sign_ins = false
